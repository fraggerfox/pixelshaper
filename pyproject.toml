[project]
name = "pixelshaper"
version = "0.1.0"
description = "Shaping-aware pixel fonts: derive hand-tunable pixel fonts from OpenType donors, GSUB/GPOS intact"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "freetype-py",
    "uharfbuzz",
    "fonttools",
]

[project.scripts]
pixelshaper = "pixelshaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
