[project]
name = "pixelshaper"
version = "0.0.1"
description = "Shaping-aware pixel fonts: derive hand-tunable pixel fonts from OpenType donors, GSUB/GPOS intact"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "freetype-py",
    "uharfbuzz",
    "fonttools",
]

