[project]
name = "pixelshaper"
version = "0.1.0"
description = "Shaping-aware pixel fonts: derive hand-tunable pixel fonts from OpenType donors, GSUB/GPOS intact"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pillow",
    "freetype-py",
    "uharfbuzz",
    "fonttools",
]

[project.scripts]
pixelshaper = "pixelshaper.cli:main"

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-cov",
    # ruff comes from nixpkgs (the pip wheel is dynamically linked and
    # does not run on NixOS); its config below applies either way.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pixelshaper --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# PEP 8 (pycodestyle E/W), pyflakes (F), import sorting (I), pyupgrade (UP)
select = ["E", "F", "W", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
